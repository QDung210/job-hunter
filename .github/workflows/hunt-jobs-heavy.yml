name: Hunt Jobs (Heavy)

# Slower / riskier sources: python-jobspy (LinkedIn/Indeed/Google/Glassdoor/
# ZipRecruiter) and the best-effort Wellfound collector. Runs every 3 hours to
# be gentle on GitHub Actions minutes and on the target sites. Shares
# data/seen_jobs.json with hunt-jobs.yml (light), so notifications never
# duplicate across the two schedules.

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (skip Telegram notifications)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: hunt-jobs
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job hunter (heavy tier — JobSpy + Wellfound)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ARGS="--tier heavy"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python -m src.main $ARGS

      - name: Commit updated job data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update job data (heavy run) [skip ci]"
          file_pattern: "data/*.json data/*.csv"
          commit_user_name: "job-hunter-bot"
          commit_user_email: "actions@users.noreply.github.com"
