# Technical taxonomy — categories, aliases and transferable-skill groups.
#
# transferable_group: true means: if a JD mentions a term in this category that the
# candidate does NOT know, but the candidate's known_terms (profile.yaml) includes a
# DIFFERENT term from the same category, it counts as a transferable_match (partial
# credit) instead of a missing_skill. Example: JD wants "CrewAI", candidate knows
# "LangGraph" -> both are in agent_frameworks -> transferable_match.
#
# Matching is word-boundary regex first; rapidfuzz partial/token-sort matching
# (threshold ~90) is used as a fallback for minor spelling/spacing variants.

