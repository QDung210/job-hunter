location_rules:
  # Explicit accept signals -> location_confidence: high, location_eligible: true
  accept_phrases:
    - remote worldwide
    - remote global
    - remote anywhere
    - remote apac
    - remote asia
    - southeast asia
    - " sea "
    - asia-pacific
    - vietnam
    - fully remote
    - work from anywhere
    - anywhere in the world
    - eor global
    - async remote
  # Explicit hard-reject signals -> location_eligible: false regardless of score
  reject_phrases:
    - us citizens only
    - us citizen only
    - us residents only
    - us resident only
    - united states residents only
    - us work authorization required
    - must be authorized to work in the us
    - authorized to work in the united states
    - canada only
    - canadian residents only
    - eu residents only
    - european union residents only
    - uk only
    - united kingdom only
    - uk residents only
    - india only
    - based in india only
    - australia only
    - australian residents only

experience_rules:
  # thresholds for penalty on required YOE above candidate's years, scaled by
  # required vs preferred (see filters.py:parse_experience)
  penalty_by_gap:
    "1": 0        # <=1 year above candidate -> no penalty
    "2": 5
    "3": 15
    "4": 30
    "5": 50
  preferred_penalty_multiplier: 0.4   # "preferred"/"nice to have" penalties scaled down

thresholds:
  notify: 82     # immediate Telegram notification
  digest: 75     # batched digest notification
  hot: 90        # 🚨🚨 HOT JOB 🚨🚨 prefix

search:
  max_age_days: 14           # jobs older than this are dropped before scoring
  seen_jobs_expiry_days: 45  # prune data/seen_jobs.json entries older than this

url_check:
  enabled: true
  min_score_to_check: 75     # only verify URLs for jobs that would be reported
  timeout_seconds: 6
